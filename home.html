<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ name }} Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cyan: #39e7ff;
      --cyan-dim: rgba(57, 231, 255, 0.18);
      --gold: #f0c75e;
      --red: #ff5d73;
      --bg: #03060d;
      --panel: rgba(6, 16, 32, 0.72);
      --text: #d7f6ff;
      --muted: #7aa0b3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Rajdhani, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% -10%, #12304a 0%, transparent 50%),
        linear-gradient(180deg, #050a14 0%, var(--bg) 100%);
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; opacity: 0.18;
      background-image:
        linear-gradient(rgba(57,231,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57,231,255,0.08) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    body::after {
      content: "";
      position: fixed; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom, transparent 0, transparent 2px, rgba(0,0,0,0.08) 3px);
      opacity: 0.35;
    }
    .shell {
      height: 100%;
      display: grid;
      grid-template-rows: 72px 1fr 96px;
      gap: 12px;
      padding: 16px 20px 14px;
      position: relative; z-index: 1;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid var(--cyan-dim);
      background: var(--panel);
      padding: 0 22px;
      clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
    }
    .brand { display: flex; align-items: baseline; gap: 14px; }
    .brand h1 {
      font-family: Orbitron, sans-serif;
      letter-spacing: 0.28em;
      font-size: 22px;
      color: var(--cyan);
      text-shadow: 0 0 18px rgba(57,231,255,0.55);
    }
    .brand span { color: var(--muted); letter-spacing: 0.18em; font-size: 13px; }
    .meta { display: flex; gap: 28px; font-size: 15px; letter-spacing: 0.08em; }
    .meta b { color: var(--cyan); font-weight: 600; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
      display: inline-block; margin-right: 8px; animation: pulse 1.8s infinite;
    }
    .dot.off { background: var(--red); box-shadow: 0 0 10px var(--red); animation: none; }
    .grid {
      display: grid;
      grid-template-columns: 280px 1fr 300px;
      gap: 12px; min-height: 0;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--cyan-dim);
      padding: 16px;
      position: relative;
      overflow: hidden;
    }
    .panel h2 {
      font-family: Orbitron, sans-serif;
      font-size: 11px; letter-spacing: 0.22em;
      color: var(--cyan); margin-bottom: 14px;
    }
    .core {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px;
    }
    .orb {
      width: 196px; height: 196px; position: relative;
      display: grid; place-items: center;
    }
    .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid rgba(57,231,255,0.35);
      animation: spin 18s linear infinite;
    }
    .ring:nth-child(2) { inset: 16px; border-style: dashed; animation-duration: 12s; animation-direction: reverse; }
    .ring:nth-child(3) { inset: 34px; border-width: 2px; animation-duration: 8s; }
    .core-ball {
      width: 78px; height: 78px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #bff7ff, #1ad1ff 45%, #024 80%);
      box-shadow: 0 0 40px rgba(57,231,255,0.7), inset 0 0 20px #fff;
      z-index: 2;
    }
    .orb.thinking .core-ball { animation: throb 0.7s ease-in-out infinite; }
    .orb.speaking .core-ball { animation: throb 0.45s ease-in-out infinite; }
    .status-line { letter-spacing: 0.2em; font-size: 13px; color: var(--gold); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chip {
      border: 1px solid var(--cyan-dim); background: transparent;
      color: var(--text); font: 600 13px Rajdhani, sans-serif;
      letter-spacing: 0.08em; padding: 6px 10px; cursor: pointer;
    }
    .chip:hover { border-color: var(--cyan); color: var(--cyan); }
    #log {
      height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      padding-right: 6px;
    }
    .msg { max-width: 86%; padding: 10px 12px; line-height: 1.35; font-size: 17px; }
    .msg.user {
      align-self: flex-end; background: rgba(57,231,255,0.1);
      border: 1px solid var(--cyan-dim);
    }
    .msg.shai {
      align-self: flex-start; border-left: 2px solid var(--cyan);
      background: rgba(0,0,0,0.25);
    }
    .msg small { display: block; color: var(--muted); font-size: 11px; letter-spacing: 0.16em; margin-bottom: 4px; }
    .stat { margin-bottom: 14px; }
    .stat .row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
    .bar { height: 6px; background: rgba(255,255,255,0.06); }
    .bar > i { display: block; height: 100%; background: var(--cyan); width: 0%; box-shadow: 0 0 8px var(--cyan); }
    footer.dock {
      display: grid; grid-template-columns: 1fr auto;
      gap: 10px; align-items: center;
      border: 1px solid var(--cyan-dim); background: var(--panel);
      padding: 12px;
    }
    #cmd {
      width: 100%; background: transparent; border: 1px solid var(--cyan-dim);
      color: var(--text); font: 500 18px Rajdhani, sans-serif;
      padding: 14px 16px; outline: none;
    }
    #cmd:focus { border-color: var(--cyan); }
    .btns { display: flex; gap: 8px; }
    button.act {
      min-width: 54px; height: 48px; cursor: pointer;
      background: rgba(57,231,255,0.08); border: 1px solid var(--cyan);
      color: var(--cyan); font-family: Orbitron, sans-serif; font-size: 11px;
      letter-spacing: 0.08em;
    }
    button.act:hover { background: rgba(57,231,255,0.2); }
    button.act.live { background: var(--red); border-color: var(--red); color: #fff; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes throb { 50% { transform: scale(1.12); filter: brightness(1.3); } }
    @keyframes pulse { 50% { opacity: 0.35; } }
    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
      .shell { overflow: auto; height: auto; min-height: 100%; }
      body { overflow: auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <h1>{{ name }}</h1>
        <span>HOME NODE</span>
      </div>
      <div class="meta">
        <div><span id="linkdot" class="dot"></span><span id="link">CONNECTING</span></div>
        <div>TIME <b id="clock">--:--:--</b></div>
        <div>USER <b>{{ user }}</b></div>
      </div>
    </header>

    <section class="grid">
      <aside class="panel core">
        <h2>CORE</h2>
        <div class="orb" id="orb">
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="core-ball"></div>
        </div>
        <div class="status-line" id="phase">STANDBY</div>
        <div class="chips">
          <button class="chip" data-q="What time is it?">TIME</button>
          <button class="chip" data-q="What's the weather?">WEATHER</button>
          <button class="chip" data-q="System status">SYSTEM</button>
          <button class="chip" data-q="Read my notes">NOTES</button>
          <button class="chip" data-q="Open the browser">BROWSER</button>
        </div>
      </aside>

      <main class="panel">
        <h2>COMMS</h2>
        <div id="log"></div>
      </main>

      <aside class="panel">
        <h2>TELEMETRY</h2>
        <div class="stat"><div class="row"><span>CPU</span><span id="cpu">—</span></div><div class="bar"><i id="cpuBar"></i></div></div>
        <div class="stat"><div class="row"><span>MEMORY</span><span id="mem">—</span></div><div class="bar"><i id="memBar"></i></div></div>
        <div class="stat"><div class="row"><span>DISK</span><span id="disk">—</span></div><div class="bar"><i id="diskBar"></i></div></div>
        <div class="stat"><div class="row"><span>BATTERY</span><span id="bat">—</span></div><div class="bar"><i id="batBar"></i></div></div>
        <div class="stat" style="margin-top:22px">
          <div class="row"><span>DATE</span><span id="date">—</span></div>
          <div class="row"><span>MODEL</span><span id="model">—</span></div>
          <div class="row"><span>VOICE</span><span id="voice">—</span></div>
          <div class="row"><span>HOST</span><span id="host">—</span></div>
          <div class="row"><span>CITY</span><span id="city">—</span></div>
        </div>
      </aside>
    </section>

    <footer class="dock">
      <input id="cmd" autocomplete="off" placeholder="Address {{ name }}…  e.g. weather in Tokyo" />
      <div class="btns">
        <button class="act" id="mic" type="button">MIC</button>
        <button class="act" id="send" type="button">SEND</button>
      </div>
    </footer>
  </div>

  <script>
    const log = document.getElementById("log");
    const cmd = document.getElementById("cmd");
    const orb = document.getElementById("orb");
    const phase = document.getElementById("phase");
    const name = "{{ name }}";
    let player = null;

    function addMsg(who, text) {
      const el = document.createElement("div");
      el.className = "msg " + who;
      el.innerHTML = "<small>" + (who === "user" ? "YOU" : name.toUpperCase()) + "</small>" +
        text.replace(/</g, "&lt;");
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    function setPhase(mode) {
      orb.classList.remove("thinking", "speaking");
      if (mode === "thinking") orb.classList.add("thinking");
      if (mode === "speaking") orb.classList.add("speaking");
      phase.textContent = mode === "thinking" ? "THINKING"
                        : mode === "speaking" ? "SPEAKING"
                        : "STANDBY";
    }

    function playMale(audioB64) {
      if (player) { player.pause(); player = null; }
      if (!audioB64) { setPhase("idle"); return; }
      player = new Audio("data:audio/mpeg;base64," + audioB64);
      setPhase("speaking");
      player.onended = () => setPhase("idle");
      player.onerror = () => setPhase("idle");
      player.play().catch(() => setPhase("idle"));
    }

    async function ask(text) {
      if (!text) return;
      addMsg("user", text);
      cmd.value = "";
      setPhase("thinking");
      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await r.json();
        addMsg("shai", data.reply || data.error || "No reply.");
        playMale(data.audio);
      } catch (e) {
        addMsg("shai", "Home link dropped. Is the server running?");
        setPhase("idle");
      }
    }

    document.getElementById("send").onclick = () => ask(cmd.value.trim());
    cmd.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(cmd.value.trim()); });
    document.querySelectorAll(".chip").forEach((c) => c.onclick = () => ask(c.dataset.q));

    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = document.getElementById("mic");
    if (Speech) {
      const rec = new Speech();
      rec.lang = "en-US"; rec.interimResults = false;
      rec.onresult = (e) => ask(e.results[0][0].transcript);
      rec.onend = () => micBtn.classList.remove("live");
      micBtn.onclick = () => { micBtn.classList.add("live"); rec.start(); };
    } else {
      micBtn.disabled = true; micBtn.textContent = "N/A";
    }

    async function tick() {
      try {
        const s = await (await fetch("/api/status")).json();
        document.getElementById("clock").textContent = s.time;
        document.getElementById("date").textContent = s.date;
        document.getElementById("model").textContent = s.model;
        document.getElementById("voice").textContent = s.voice || "—";
        document.getElementById("host").textContent = s.host;
        document.getElementById("city").textContent = s.city;
        document.getElementById("link").textContent = s.online ? "LLM LINK" : "OFFLINE CORE";
        document.getElementById("linkdot").classList.toggle("off", !s.online);
        const v = s.vitals || {};
        const set = (id, bar, val) => {
          document.getElementById(id).textContent = val == null ? "—" : val + "%";
          document.getElementById(bar).style.width = (val || 0) + "%";
        };
        set("cpu", "cpuBar", v.cpu);
        set("mem", "memBar", v.memory);
        set("disk", "diskBar", v.disk);
        const batLabel = v.battery == null ? "—" : v.battery + "%" + (v.charging ? " CHG" : "");
        document.getElementById("bat").textContent = batLabel;
        document.getElementById("batBar").style.width = (v.battery || 0) + "%";
      } catch (_) {}
    }
    tick(); setInterval(tick, 2000);

    addMsg("shai", "Home node online. " + name + " is listening, {{ user }}.");
  </script>
</body>
        </html>
